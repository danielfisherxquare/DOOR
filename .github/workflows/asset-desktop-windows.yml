name: ArcSpro Assets Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/asset-library
    paths:
      - '.github/workflows/asset-desktop-windows.yml'
      - 'apps/asset-desktop/**'
      - 'packages/asset-client/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: asset-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64 installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run asset tests
        run: npm run test:assets

      - name: Build MSI and NSIS installers
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/asset-desktop
          args: --bundles msi,nsis --target x86_64-pc-windows-msvc
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: arcspro-assets-[version]-windows-[arch]-[bundle]

      - name: Verify installers and write checksums
        shell: pwsh
        run: ./script/build_windows.ps1 -VerifyOnly

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: arcspro-assets-windows-x64-checksums
          path: artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
