# ArcSpro Assets LAN validation stack.
# Run together with docker-compose.yml; it uses isolated host ports and data paths.
services:
  postgres:
    environment:
      POSTGRES_DB: ${LAN_POSTGRES_DB:-door_assets_lan}
      POSTGRES_USER: door
      POSTGRES_PASSWORD: ${LAN_POSTGRES_PASSWORD:-door_lan_dev}
    volumes: !override
      - "${LAN_DATA_ROOT:-/Users/xquare/scratch/door-assets-lan-data}/postgres:/var/lib/postgresql/data"
    ports: !override
      - "${LAN_POSTGRES_PORT:-55433}:5432"
    restart: unless-stopped

  redis:
    ports:
      - "${LAN_REDIS_PORT:-16380}:6379"
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${LAN_MINIO_ACCESS_KEY:-arcspro_lan}
      MINIO_ROOT_PASSWORD: ${LAN_MINIO_SECRET_KEY:-arcspro_lan_dev_only}
    volumes: !override
      - "${LAN_DATA_ROOT:-/Users/xquare/scratch/door-assets-lan-data}/assets:/data"
    ports:
      - "${LAN_MINIO_API_PORT:-19010}:9000"
      - "${LAN_MINIO_CONSOLE_PORT:-19011}:9001"

  migrate:
    image: arcspro-assets-lan-app:latest
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://door:${LAN_POSTGRES_PASSWORD:-door_lan_dev}@postgres:5432/${LAN_POSTGRES_DB:-door_assets_lan}

  app:
    image: arcspro-assets-lan-app:latest
    ports: !override
      - "${LAN_APP_PORT:-3302}:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://door:${LAN_POSTGRES_PASSWORD:-door_lan_dev}@postgres:5432/${LAN_POSTGRES_DB:-door_assets_lan}
      JWT_SECRET: ${LAN_JWT_SECRET:-door_assets_lan_jwt}
      AUTHZ_PROVIDER: local
      CORS_ORIGIN: "${LAN_PUBLIC_URL:-http://192.168.1.97:18081}"
      PUBLIC_BASE_URL: "${LAN_PUBLIC_URL:-http://192.168.1.97:18081}"
      MINIO_ACCESS_KEY: ${LAN_MINIO_ACCESS_KEY:-arcspro_lan}
      MINIO_SECRET_KEY: ${LAN_MINIO_SECRET_KEY:-arcspro_lan_dev_only}
    volumes: !override
      - "${LAN_DATA_ROOT:-/Users/xquare/scratch/door-assets-lan-data}/backups:/backups"
      - "${LAN_DATA_ROOT:-/Users/xquare/scratch/door-assets-lan-data}/storage:/app/server/storage"
    restart: unless-stopped

  nginx:
    ports: !override
      - "${LAN_HTTP_PORT:-18081}:80"
    volumes: !override
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/usr/share/nginx/html:ro
    restart: unless-stopped
