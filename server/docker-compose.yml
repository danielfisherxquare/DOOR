services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-door}
      POSTGRES_USER: door
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-door_dev}
    volumes:
      # ⚠️ 绑定挂载到宿主机目录，docker compose down -v 不会删除
      - ${PGDATA_HOST_DIR:-./pgdata}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U door" ]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-arcspro}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-arcspro_dev_only}
    volumes:
      # 四人团队的素材原文件持久化在宿主机，不随容器删除。
      - ${ASSET_DATA_HOST_DIR:-./asset-data}:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: arcspro-server-app:latest
    command: [ "npm", "run", "migrate" ]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://door:${POSTGRES_PASSWORD:-door_dev}@postgres:5432/${POSTGRES_DB:-door}
      NODE_ENV: ${NODE_ENV:-development}
      ASSESSMENT_FIELD_ENCRYPTION_KEY: ${ASSESSMENT_FIELD_ENCRYPTION_KEY:-}
      ASSESSMENT_SESSION_JWT_SECRET: ${ASSESSMENT_SESSION_JWT_SECRET:-}
      ASSESSMENT_HASH_PEPPER: ${ASSESSMENT_HASH_PEPPER:-}
      PII_ACTIVE_KEY_VERSION: ${PII_ACTIVE_KEY_VERSION:-v1}
      PII_ENCRYPTION_KEY_V1: ${PII_ENCRYPTION_KEY_V1:-}
      PII_HMAC_KEY_V1: ${PII_HMAC_KEY_V1:-}
      PII_ENCRYPTION_KEY_V2: ${PII_ENCRYPTION_KEY_V2:-}
      PII_HMAC_KEY_V2: ${PII_HMAC_KEY_V2:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: arcspro-server-app:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: [ "node", "src/index.js" ]
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://door:${POSTGRES_PASSWORD:-door_dev}@postgres:5432/${POSTGRES_DB:-door}
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      ASSESSMENT_FIELD_ENCRYPTION_KEY: ${ASSESSMENT_FIELD_ENCRYPTION_KEY:-}
      ASSESSMENT_SESSION_JWT_SECRET: ${ASSESSMENT_SESSION_JWT_SECRET:-}
      ASSESSMENT_HASH_PEPPER: ${ASSESSMENT_HASH_PEPPER:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@platform.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTHZ_PROVIDER: ${AUTHZ_PROVIDER:-}
      FGA_API_URL: ${FGA_API_URL:-}
      FGA_STORE_ID: ${FGA_STORE_ID:-}
      FGA_MODEL_ID: ${FGA_MODEL_ID:-}
      FGA_API_TOKEN: ${FGA_API_TOKEN:-}
      # PII 加密密钥（key-guard 启动时验证一致性）
      PII_ACTIVE_KEY_VERSION: ${PII_ACTIVE_KEY_VERSION:-v1}
      PII_ENCRYPTION_KEY_V1: ${PII_ENCRYPTION_KEY_V1:-}
      PII_HMAC_KEY_V1: ${PII_HMAC_KEY_V1:-}
      PII_ENCRYPTION_KEY_V2: ${PII_ENCRYPTION_KEY_V2:-}
      PII_HMAC_KEY_V2: ${PII_HMAC_KEY_V2:-}
      # Optional runtime config (recommended in production)
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://www.xquareliu.com}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      RESTORE_UPLOAD_DIR: ${RESTORE_UPLOAD_DIR:-/backups/uploads}
      DB_OPS_LOCK_DIR: ${DB_OPS_LOCK_DIR:-/backups/.db-ops.lock}
      REIMBURSEMENT_OCR_PROVIDER: ${REIMBURSEMENT_OCR_PROVIDER:-qwen}
      REIMBURSEMENT_OCR_BASE_URL: ${REIMBURSEMENT_OCR_BASE_URL:-}
      REIMBURSEMENT_OCR_API_KEY: ${REIMBURSEMENT_OCR_API_KEY:-}
      REIMBURSEMENT_OCR_MODEL_NAME: ${REIMBURSEMENT_OCR_MODEL_NAME:-qwen3.5-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ASSET_OBJECT_STORAGE_PROVIDER: ${ASSET_OBJECT_STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-arcspro}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-arcspro_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-arcspro-assets}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health/ready || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ${HOST_BACKUP_DIR:-./backups}:${BACKUP_DIR:-/backups}
      - ./storage:/app/server/storage
      # Required for .env backup to function correctly inside the container
      - ./.env:/app/server/.env:ro

  worker:
    image: arcspro-server-app:latest
    command: [ "node", "src/worker.js" ]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://door:${POSTGRES_PASSWORD:-door_dev}@postgres:5432/${POSTGRES_DB:-door}
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      ASSESSMENT_FIELD_ENCRYPTION_KEY: ${ASSESSMENT_FIELD_ENCRYPTION_KEY:-}
      ASSESSMENT_SESSION_JWT_SECRET: ${ASSESSMENT_SESSION_JWT_SECRET:-}
      ASSESSMENT_HASH_PEPPER: ${ASSESSMENT_HASH_PEPPER:-}
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTHZ_PROVIDER: ${AUTHZ_PROVIDER:-}
      FGA_API_URL: ${FGA_API_URL:-}
      FGA_STORE_ID: ${FGA_STORE_ID:-}
      FGA_MODEL_ID: ${FGA_MODEL_ID:-}
      FGA_API_TOKEN: ${FGA_API_TOKEN:-}
      # PII 加密密钥（名单导入 worker 会生成盲索引）
      PII_ACTIVE_KEY_VERSION: ${PII_ACTIVE_KEY_VERSION:-v1}
      PII_ENCRYPTION_KEY_V1: ${PII_ENCRYPTION_KEY_V1:-}
      PII_HMAC_KEY_V1: ${PII_HMAC_KEY_V1:-}
      PII_ENCRYPTION_KEY_V2: ${PII_ENCRYPTION_KEY_V2:-}
      PII_HMAC_KEY_V2: ${PII_HMAC_KEY_V2:-}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://www.xquareliu.com}
      REIMBURSEMENT_OCR_PROVIDER: ${REIMBURSEMENT_OCR_PROVIDER:-qwen}
      REIMBURSEMENT_OCR_BASE_URL: ${REIMBURSEMENT_OCR_BASE_URL:-}
      REIMBURSEMENT_OCR_API_KEY: ${REIMBURSEMENT_OCR_API_KEY:-}
      REIMBURSEMENT_OCR_MODEL_NAME: ${REIMBURSEMENT_OCR_MODEL_NAME:-qwen3.5-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ASSET_OBJECT_STORAGE_PROVIDER: ${ASSET_OBJECT_STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-arcspro}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-arcspro_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-arcspro-assets}
    volumes:
      - ./storage:/app/server/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  # 自动备份：每 6 小时调用现有备份脚本，与 Web 后台完全集成
  pg-backup:
    image: arcspro-server-app:latest
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://door:${POSTGRES_PASSWORD:-door_dev}@postgres:5432/${POSTGRES_DB:-door}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-20}
      DB_OPS_LOCK_DIR: ${DB_OPS_LOCK_DIR:-/backups/.db-ops.lock}
    volumes:
      - ${HOST_BACKUP_DIR:-./backups}:${BACKUP_DIR:-/backups}
      - ./.env:/app/server/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[auto-backup] 自动备份服务已启动 (每6小时)"
        echo "[auto-backup] 备份目录: $${BACKUP_DIR}"
        echo "[auto-backup] 保留策略: 最近 $${BACKUP_RETENTION_COUNT} 份"
        while true; do
          echo "[auto-backup] 开始备份 ($$(date '+%Y-%m-%d %H:%M:%S'))"
          bash /app/server/scripts/run-postgres-backup.sh --trigger auto 2>&1 && \
            echo "[auto-backup] ✅ 备份成功" || \
            echo "[auto-backup] ❌ 备份失败"
          echo "[auto-backup] 下次备份: 6小时后"
          sleep 21600
        done
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../dist:/usr/share/nginx/html:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
