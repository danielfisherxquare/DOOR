# 本地开发环境覆盖配置
# 此文件会自动与 docker-compose.yml 合并
# 用于本地测试环境，不需要 SSL 证书

services:
  minio:
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"

  nginx:
    ports: !override
      - "${HTTP_PORT:-8080}:80"
    volumes: !override
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/usr/share/nginx/html:ro
